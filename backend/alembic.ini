# alembic.ini — Alembic configuration for EcoBite backend
# ---------------------------------------------------------------------------
# The `sqlalchemy.url` here is a fallback only.  At runtime the real URL is
# injected from settings inside alembic/env.py, so you never need to store
# credentials in this file.
# ---------------------------------------------------------------------------

[alembic]
script_location = migrations

# File name template for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long migration message slugs
truncate_slug_length = 40

# Fallback URL — overridden in env.py from app settings
sqlalchemy.url = sqlite+aiosqlite:///./ecobite.db

[post_write_hooks]
# Optionally run Black on newly generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
