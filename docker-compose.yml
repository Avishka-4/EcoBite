version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ecobite_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecobite
      MYSQL_USER: ecobite
      MYSQL_PASSWORD: ecobite123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ecobite_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://ecobite:ecobite123@db:3306/ecobite
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models  # mount trained YOLO models here later

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecobite_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api/v1

volumes:
  mysql_data:
